<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculator ❤️</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
    }

    .calculator {
        width: 330px;
        padding: 20px;
        border-radius: 25px;
        background: #1e1e1e;
        box-shadow: 0 15px 40px rgba(0,0,0,.5);
    }

    #display {
        width: 100%;
        height: 80px;
        border: none;
        outline: none;
        border-radius: 15px;
        background: #292929;
        color: white;
        font-size: 32px;
        text-align: right;
        padding: 15px;
        margin-bottom: 15px;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    button {
        height: 65px;
        border: none;
        border-radius: 15px;
        background: #333;
        color: white;
        font-size: 22px;
        cursor: pointer;
    }

    button:active {
        transform: scale(.95);
    }

    .operator {
        background: #555;
    }

    .equals {
        background: #e91e63;
    }

    .clear {
        grid-column: span 4;
        background: #444;
    }

    /* SONG SCREEN */

    #songScreen {
        display: none;
        position: fixed;
        inset: 0;
        background: #080808;
        color: white;
        text-align: center;
        padding: 30px;
        overflow-y: auto;
    }

    #songScreen h1 {
        margin-top: 60px;
        font-size: 32px;
    }

    #songScreen h2 {
        color: #aaa;
        font-weight: normal;
    }

    #lyrics {
        max-width: 600px;
        margin: 40px auto;
        font-size: 22px;
        line-height: 1.8;
        white-space: pre-wrap;
    }

    #back {
        padding: 12px 25px;
        background: #e91e63;
        border-radius: 10px;
        font-size: 16px;
    }
</style>
</head>

<body>

<div class="calculator" id="calculator">

    <input id="display" readonly>

    <div class="buttons">

        <button onclick="clearDisplay()" class="clear">C</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button onclick="add('÷')" class="operator">÷</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('×')" class="operator">×</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="add('-')" class="operator">−</button>

        <button onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>
        <button onclick="add('+')" class="operator">+</button>
        <button onclick="calculate()" class="equals">=</button>

    </div>
</div>


<!-- SECRET SONG SCREEN -->

<div id="songScreen">

    <h1>❤️ On Bended Knee</h1>
    <h2>Boyz II Men</h2>

    <audio id="song" controls>
        <source src="bended_knee.mp3" type="audio/mpeg">
    </audio>

    <div id="lyrics">
        Put your authorized lyrics here.
    </div>

    <button id="back" onclick="goBack()">← Calculator</button>

</div>


<script>

let display = document.getElementById("display");

function add(value) {
    display.value += value;
}

function clearDisplay() {
    display.value = "";
}

function calculate() {

    let expression = display.value;

    // SECRET EASTER EGG
    if (expression === "67×67") {

        document.getElementById("calculator").style.display = "none";
        document.getElementById("songScreen").style.display = "block";

        let song = document.getElementById("song");

        song.currentTime = 0;

        // Browser may require a user interaction.
        song.play().catch(() => {
            console.log("Press play to start the song.");
        });

        loadLyrics();

        return;
    }

    try {

        let math = expression
            .replace(/×/g, "*")
            .replace(/÷/g, "/")
            .replace(/−/g, "-");

        let result = Function(
            '"use strict"; return (' + math + ')'
        )();

        display.value = result;

    } catch {
        display.value = "Error";
    }
}


function loadLyrics() {

    fetch("lyrics.txt")
        .then(response => response.text())
        .then(text => {
            document.getElementById("lyrics").textContent = text;
        })
        .catch(() => {
            document.getElementById("lyrics").textContent =
                "Lyrics file not found.";
        });
}


function goBack() {

    let song = document.getElementById("song");

    song.pause();
    song.currentTime = 0;

    document.getElementById("songScreen").style.display = "none";
    document.getElementById("calculator").style.display = "block";

    clearDisplay();
}

</script>

</body>
</html>
