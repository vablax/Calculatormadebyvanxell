<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>67 × 67 ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

/* =========================
   CALCULATOR
========================= */

#calculator {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    transition:
        opacity 1s ease,
        transform 1.2s cubic-bezier(.7,-.4,.2,1);
}

.calculator-box {
    width: min(360px, 92vw);
    padding: 20px;

    border-radius: 30px;

    background: rgba(255,255,255,.06);

    border: 1px solid rgba(255,255,255,.1);

    box-shadow:
        0 30px 80px rgba(0,0,0,.7),
        0 0 40px rgba(255,40,100,.15);
}

#display {
    width: 100%;
    height: 85px;

    border: none;
    outline: none;

    border-radius: 18px;

    background: #151515;

    color: white;

    font-size: 32px;

    text-align: right;

    padding: 15px;
}

.buttons {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

    margin-top: 15px;
}

button {
    height: 65px;

    border: none;

    border-radius: 18px;

    background: #292929;

    color: white;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;

    transition: .15s;
}

button:active {
    transform: scale(.88);
}

.operator {
    background: #3d2730;
    color: #ff6b9a;
}

.equals {
    background:
        linear-gradient(
            135deg,
            #ff1766,
            #ff62a0
        );

    box-shadow:
        0 0 25px
        rgba(255,30,100,.4);
}

.clear {
    grid-column: span 4;
}


/* =========================
   DRAMATIC FLASH
========================= */

#flash {
    position: fixed;

    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 100;
}

.flash {
    animation:
        flashAnimation .8s ease;
}

@keyframes flashAnimation {

    0% {
        opacity: 0;
    }

    30% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

.calculator-exit {
    opacity: 0;

    transform:
        scale(3)
        rotate(5deg);
}


/* =========================
   SONG SCREEN
========================= */

#songScreen {

    position: fixed;

    inset: 0;

    opacity: 0;

    transform: scale(.7);

    pointer-events: none;

    transition:
        opacity 1.3s ease,
        transform 1.3s
        cubic-bezier(.16,1,.3,1);

    overflow: hidden;

    text-align: center;

    background:

        radial-gradient(
            circle at 50% 25%,
            rgba(255,30,100,.35),
            transparent 35%
        ),

        radial-gradient(
            circle at 10% 90%,
            rgba(80,30,255,.2),
            transparent 35%
        ),

        #050505;
}

.song-active {

    opacity: 1 !important;

    transform: scale(1) !important;

    pointer-events: auto !important;
}


/* =========================
   MOVING LIGHTS
========================= */

.light {

    position: absolute;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    filter: blur(120px);

    opacity: .2;

    animation:
        floating 8s infinite
        alternate ease-in-out;
}

.light1 {

    background: #ff176d;

    top: -250px;
    left: -150px;
}

.light2 {

    background: #6633ff;

    right: -200px;
    bottom: -250px;

    animation-delay: -3s;
}

@keyframes floating {

    from {
        transform:
            translate(0,0)
            scale(1);
    }

    to {
        transform:
            translate(100px,70px)
            scale(1.3);
    }
}


/* =========================
   ALBUM
========================= */

.album-container {

    position: relative;

    z-index: 3;

    margin-top: 45px;
}

.album {

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            #111 0 7%,
            #444 8% 9%,
            #111 10% 18%,
            #333 19% 20%,
            #111 21% 100%
        );

    border:
        4px solid
        rgba(255,255,255,.15);

    box-shadow:

        0 0 30px
        rgba(255,40,110,.5),

        0 0 80px
        rgba(255,40,110,.2);

    animation:
        spin 5s linear infinite;
}

.album::after {

    content: "❤️";

    position: absolute;

    width: 65px;
    height: 65px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #ff1766,
            #ff79aa
        );

    font-size: 27px;

    box-shadow:
        0 0 30px
        rgba(255,40,100,.8);
}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* =========================
   TITLE
========================= */

.title {

    position: relative;

    z-index: 3;

    margin-top: 20px;

    text-shadow:
        0 0 10px
        rgba(255,50,120,.8),

        0 0 30px
        rgba(255,30,100,.4);
}

.title h1 {

    font-size:
        clamp(26px,7vw,42px);

    letter-spacing: 3px;
}

.title p {

    margin-top: 6px;

    color: #aaa;
}


/* =========================
   SYNCHRONIZED LYRICS
========================= */

#lyrics {

    position: relative;

    z-index: 3;

    width:
        min(700px,90vw);

    height: 150px;

    margin:
        25px auto 10px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    font-size:
        clamp(20px,5vw,30px);

    font-weight: bold;

    line-height: 1.5;

    text-shadow:

        0 0 10px
        rgba(255,255,255,.8),

        0 0 30px
        rgba(255,30,100,.7);

    transition:
        opacity .25s,
        transform .25s;
}

.lyric-animation {

    animation:
        lyricAppear .55s
        cubic-bezier(.16,1,.3,1);
}

@keyframes lyricAppear {

    0% {

        opacity: 0;

        transform:
            translateY(25px)
            scale(.85);

        filter: blur(8px);
    }

    100% {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

        filter: blur(0);
    }
}


/* =========================
   AUDIO
========================= */

.audio-container {

    position: relative;

    z-index: 3;

    width:
        min(500px,90vw);

    margin: 5px auto;
}

audio {

    width: 100%;
}


/* =========================
   PROGRESS
========================= */

.progress {

    position: relative;

    z-index: 3;

    width:
        min(500px,90vw);

    height: 4px;

    margin-top: 10px;

    background:
        rgba(255,255,255,.15);

    border-radius: 10px;

    overflow: hidden;
}

.progress-bar {

    width: 0%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #ff1766,
            #ff82ad
        );

    box-shadow:
        0 0 10px #ff1766;

    transition:
        width .1s linear;
}


/* =========================
   BACK BUTTON
========================= */

#back {

    position: relative;

    z-index: 3;

    margin-top: 20px;

    height: 45px;

    padding: 0 25px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.15);

    font-size: 14px;
}


/* =========================
   FLOATING HEARTS
========================= */

.heart {

    position: absolute;

    bottom: -30px;

    color: #ff3c79;

    pointer-events: none;

    z-index: 2;

    animation:
        heartFloat 4s linear forwards;
}

@keyframes heartFloat {

    0% {

        opacity: 0;

        transform:
            translateY(20px)
            scale(.5);
    }

    15% {
        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translateY(-500px)
            scale(1.5);
    }
}
</style>
</head>


<body>


<!-- FLASH EFFECT -->

<div id="flash"></div>


<!-- =========================
     CALCULATOR
========================= -->

<div id="calculator">

<div class="calculator-box">

<input
    id="display"
    readonly
>

<div class="buttons">


<button
    class="clear"
    onclick="clearDisplay()">

    C

</button>


<button onclick="add('7')">
    7
</button>

<button onclick="add('8')">
    8
</button>

<button onclick="add('9')">
    9
</button>

<button
    class="operator"
    onclick="add('÷')">

    ÷

</button>


<button onclick="add('4')">
    4
</button>

<button onclick="add('5')">
    5
</button>

<button onclick="add('6')">
    6
</button>

<button
    class="operator"
    onclick="add('×')">

    ×

</button>


<button onclick="add('1')">
    1
</button>

<button onclick="add('2')">
    2
</button>

<button onclick="add('3')">
    3
</button>

<button
    class="operator"
    onclick="add('-')">

    −

</button>


<button onclick="add('0')">
    0
</button>

<button onclick="add('.')">
    .
</button>

<button
    class="operator"
    onclick="add('+')">

    +

</button>

<button
    class="equals"
    onclick="calculate()">

    =

</button>


</div>

</div>

</div>


<!-- =========================
     SONG EXPERIENCE
========================= -->

<div id="songScreen">


<div class="light light1"></div>
<div class="light light2"></div>


<div class="album-container">

<div class="album"></div>

</div>


<div class="title">

<h1>
ON BENDED KNEE
</h1>

<p>
Boyz II Men
</p>

</div>


<div id="lyrics">
❤️
</div>


<!-- YOUR EXACT MP3 FILE -->

<div class="audio-container">

<audio
    id="song"
    controls
>

<source
    src="Boys_To_Men_-_ON_BENDED_KNEE_(mp3.pm).mp3"
    type="audio/mpeg"
>

Your browser does not support audio.

</audio>

</div>


<div class="progress">

<div
    class="progress-bar"
    id="progressBar">
</div>

</div>


<button
    id="back"
    onclick="goBack()">

← Calculator

</button>


</div>


<script>

/* =========================
   ELEMENTS
========================= */

const display =
    document.getElementById(
        "display"
    );

const calculator =
    document.getElementById(
        "calculator"
    );

const songScreen =
    document.getElementById(
        "songScreen"
    );

const song =
    document.getElementById(
        "song"
    );

const lyricsElement =
    document.getElementById(
        "lyrics"
    );

const flash =
    document.getElementById(
        "flash"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );


/* =========================
   LYRICS
========================= */

let lyrics = [];

let currentLyric = -1;


/* =========================
   CALCULATOR
========================= */

function add(value) {

    display.value += value;

}


function clearDisplay() {

    display.value = "";

}


function calculate() {

    const expression =
        display.value;


    /*
       SECRET COMBINATION:

       67 × 67
    */

    if (
        expression === "67×67"
    ) {

        activateSong();

        return;
    }


    try {

        const math =
            expression

                .replace(
                    /×/g,
                    "*"
                )

                .replace(
                    /÷/g,
                    "/"
                )

                .replace(
                    /−/g,
                    "-"
                );


        const result =
            Function(
                '"use strict";' +
                'return (' +
                math +
                ')'
            )();


        display.value =
            result;

    }

    catch {

        display.value =
            "Error";

    }
}


/* =========================
   START SONG
========================= */

function activateSong() {


    /* FLASH */

    flash.classList.remove(
        "flash"
    );

    void flash.offsetWidth;

    flash.classList.add(
        "flash"
    );


    /* CALCULATOR ZOOM */

    calculator.classList.add(
        "calculator-exit"
    );


    /* SHOW SONG */

    setTimeout(() => {

        songScreen.classList.add(
            "song-active"
        );


        createHearts();


        loadLyrics();


        song.currentTime = 0;


        song.play().catch(() => {

            console.log(
                "Press play if autoplay was blocked."
            );

        });

    },500);
}


/* =========================
   LOAD SYNCHRONIZED LYRICS
========================= */

async function loadLyrics() {

    try {

        const response =
            await fetch(
                "lyrics.json"
            );


        if (!response.ok) {

            throw new Error(
                "lyrics.json not found"
            );

        }


        lyrics =
            await response.json();


        currentLyric = -1;


        updateLyric();

    }

    catch(error) {

        console.error(error);

        lyricsElement.textContent =
            "Add your authorized lyrics to lyrics.json ❤️";

    }
}


/* =========================
   SYNC LYRICS TO AUDIO
========================= */

function updateLyric() {

    if (
        lyrics.length === 0
    ) {
        return;
    }


    const time =
        song.currentTime;


    let newIndex = -1;


    for (
        let i = 0;
        i < lyrics.length;
        i++
    ) {

        if (
            time >=
                lyrics[i].start
            &&
            time <
                lyrics[i].end
        ) {

            newIndex = i;

            break;
        }

    }


    /* ONLY CHANGE WHEN LYRIC CHANGES */

    if (
        newIndex !==
        currentLyric
    ) {

        currentLyric =
            newIndex;


        if (
            newIndex >= 0
        ) {

            lyricsElement
                .classList
                .remove(
                    "lyric-animation"
                );


            void lyricsElement
                .offsetWidth;


            lyricsElement.textContent =
                lyrics[
                    newIndex
                ].text;


            lyricsElement
                .classList
                .add(
                    "lyric-animation"
                );

        }

        else {

            lyricsElement.textContent =
                "";

        }

    }

}


/* =========================
   AUDIO TIME UPDATE
========================= */

song.addEventListener(
    "timeupdate",
    () => {


        /* SYNCHRONIZE LYRICS */

        updateLyric();


        /* PROGRESS BAR */

        if (
            song.duration
        ) {

            const percent =
                (
                    song.currentTime /
                    song.duration
                ) * 100;


            progressBar.style.width =
                percent + "%";

        }

    }
);


/* =========================
   SEEK SUPPORT
========================= */

song.addEventListener(
    "seeked",
    () => {

        updateLyric();

    }
);


/* =========================
   HEART PARTICLES
========================= */

let heartsStarted =
    false;


function createHearts() {

    if (
        heartsStarted
    ) {
        return;
    }


    heartsStarted =
        true;


    setInterval(() => {

        const heart =
            document.createElement(
                "div"
            );


        heart.className =
            "heart";


        heart.textContent =
            Math.random() > .5
                ? "❤️"
                : "♡";


        heart.style.left =
            Math.random() * 100 +
            "vw";


        heart.style.fontSize =
            (
                12 +
                Math.random() * 22
            ) + "px";


        document.body.appendChild(
            heart
        );


        setTimeout(() => {

            heart.remove();

        },4000);

    },500);

}


/* =========================
   BACK TO CALCULATOR
========================= */

function goBack() {


    song.pause();


    song.currentTime =
        0;


    songScreen.classList.remove(
        "song-active"
    );


    calculator.classList.remove(
        "calculator-exit"
    );


    display.value =
        "";


    currentLyric =
        -1;


    lyricsElement.textContent =
        "❤️";

}


/* =========================
   KEYBOARD SUPPORT
========================= */

document.addEventListener(
    "keydown",
    event => {


        if (
            event.key >= "0" &&
            event.key <= "9"
        ) {

            add(event.key);

        }


        if (
            event.key === "*"
        ) {

            add("×");

        }


        if (
            event.key === "/"
        ) {

            add("÷");

        }


        if (
            event.key === "+"
        ) {

            add("+");

        }


        if (
            event.key === "-"
        ) {

            add("-");

        }


        if (
            event.key === "Enter"
        ) {

            calculate();

        }


        if (
            event.key === "Escape"
        ) {

            clearDisplay();

        }

    }
);

</script>

</body>
</html>
